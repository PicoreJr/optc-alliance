name: Bateaux

on:
  schedule:
    - cron: '37 6 * * *'   # tous les jours vers 6h30 (UTC)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 22.13+ : lecture des fichiers TypeScript de la source
      - run: node scripts/update-ships.mjs
      - name: Enregistrer si la liste des bateaux a changé
        run: |
          git add ships.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bateaux : mise à jour depuis OPTC Ships"
          git pull --rebase
          git push
